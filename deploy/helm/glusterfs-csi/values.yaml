# Default values of the glusterfs-csi chart.
#
# The rendered output of these defaults is byte-for-byte equal to the kustomize
# sample overlay (deploy/kustomize/base + overlays/sample); hack/verify-helm.sh
# enforces that (D-33). Change the chart, never the kustomize manifests, when the
# two disagree.

# GlusterFS clusters the driver may talk to, passed verbatim (same keys,
# serialised as JSON with sorted keys) into the glusterfs-csi-config ConfigMap and
# validated by the driver when it loads it. Rendering fails when the list is empty or an entry lacks clusterID
# or servers. Example:
#   clusters:
#     - clusterID: prod
#       servers:
#         - gluster-1.example.com
#         - gluster-2.example.com
#         - gluster-3.example.com
clusters: []

# Driver image.
image:
  # Repository of the driver image.
  repository: ghcr.io/gitlayzer/glusterfs-csi
  # Image tag; empty means .Chart.AppVersion.
  tag: ""
  # Image pull policy of the driver container.
  pullPolicy: IfNotPresent

# Pull secrets added to the node DaemonSet and to the controller Deployment; not
# rendered at all when empty.
imagePullSecrets: []

# Sidecar containers of the node and controller pods.
sidecars:
  # Registers the node plugin socket with the kubelet.
  nodeDriverRegistrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.18.0
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 64Mi
  # Publishes the driver health check as /healthz for the kubelet probes.
  livenessProbe:
    image:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.20.0
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 64Mi
  # Turns PersistentVolumeClaims into CreateVolume/DeleteVolume calls.
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v6.4.0
    # The first CreateVolume has to mount the parent volume, which makes the
    # sidecar's default 15s too tight.
    timeout: 60s
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi

# Verbosity of the driver and of every sidecar (-v).
logLevel: 2

# Kubelet root directory on the nodes. Distributions that do not use
# /var/lib/kubelet (k3s, microk8s, ...) must set this: it replaces every
# occurrence in the node DaemonSet, including the mountPath of the
# Bidirectional kubelet-dir mount.
kubeletDir: /var/lib/kubelet

# Node plugin (DaemonSet glusterfs-csi-node) settings.
node:
  # --recovery-interval of the driver in node mode.
  recoveryInterval: 10s
  # Priority class of the node pods.
  priorityClassName: system-node-critical
  # Node selector of the node pods.
  nodeSelector:
    kubernetes.io/os: linux
  # Tolerations of the node pods: every node runs the plugin.
  tolerations:
    - operator: Exists
  # Empty: no affinity is rendered, matching the kustomize base.
  affinity: {}
  # No limits on purpose: the FUSE processes run in this container and an OOM
  # kill would disconnect every GlusterFS mount of the node.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

# Controller Deployment (glusterfs-csi-controller) settings.
controller:
  # Number of replicas of the controller Deployment. Only the provisioner
  # holding the leader election Lease sends RPCs, so the standby replica is
  # cheap.
  replicas: 2
  # Priority class of the controller pods.
  priorityClassName: system-cluster-critical
  # Node selector of the controller pods.
  nodeSelector:
    kubernetes.io/os: linux
  # Empty: no tolerations are rendered, matching the kustomize base.
  tolerations: []
  # Keeps the replicas apart: their hostNetwork ports are host ports, so they
  # could never share a node anyway.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: glusterfs-csi
                app.kubernetes.io/component: controller
  # No limits on purpose: the FUSE process of the parent volume lives in this
  # container, an OOM kill would abort running volume creations and deletions.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

# StorageClasses created by the chart; none by default. Every entry takes a
# required name and parameters plus optional annotations, labels, reclaimPolicy
# (Delete), volumeBindingMode (Immediate), allowVolumeExpansion (false) and
# mountOptions. Example:
#   storageClasses:
#     - name: glusterfs-subdir
#       parameters:
#         clusterID: prod
#         provisioningMode: subdir
#         parentVolume: csi-parent
#         onDelete: archive
storageClasses: []
