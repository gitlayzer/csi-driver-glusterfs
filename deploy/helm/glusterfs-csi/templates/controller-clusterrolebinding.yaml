# Binds the provisioner ClusterRole to the controller ServiceAccount.
#
# The namespace of the subject is spelled out explicitly so the manifest does not
# depend on a kustomize namespace transformer having run.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glusterfs-csi-provisioner
  labels:
    {{- include "glusterfs-csi.labels" (dict "ctx" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glusterfs-csi-provisioner
subjects:
  - kind: ServiceAccount
    name: glusterfs-csi-controller
    namespace: {{ .Release.Namespace }}
