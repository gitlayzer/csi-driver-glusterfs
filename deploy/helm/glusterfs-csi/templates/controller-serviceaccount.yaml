# ServiceAccount of the controller Deployment; the csi-provisioner uses its token to call the Kubernetes API.
#
# automountServiceAccountToken is left at its default (true) on purpose: the
# provisioner sidecar watches PVs/PVCs/StorageClasses and holds the leader
# election Lease, and the service account name is what the ClusterRoleBinding
# and RoleBinding below refer to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glusterfs-csi-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glusterfs-csi.labels" (dict "ctx" .) | nindent 4 }}
