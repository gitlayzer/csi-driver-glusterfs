# ServiceAccount of the node plugin; it never calls the Kubernetes API, so no token and no Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glusterfs-csi-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glusterfs-csi.labels" (dict "ctx" .) | nindent 4 }}
automountServiceAccountToken: false
