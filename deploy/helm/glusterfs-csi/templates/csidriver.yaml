# CSIDriver object: no attach/detach phase and only Persistent filesystem volumes (architecture.md §3).
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: glusterfs.csi.io
  labels:
    {{- include "glusterfs-csi.labels" (dict "ctx" .) | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: false
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
  requiresRepublish: false
  storageCapacity: false
