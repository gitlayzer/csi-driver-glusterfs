# Node DaemonSet of glusterfs-csi: FUSE mounts, kubelet registration and liveness on every Linux node.
#
# Every hostPath of this DaemonSet that lives below the kubelet root directory
# uses .Values.kubeletDir, the kubelet root directory of the nodes. Distributions
# that keep the kubelet state somewhere else (k3s, microk8s, ...) set kubeletDir:
# the flag --state-dir, the two --kubelet-registration-path occurrences of the
# registrar, the socket-dir, registration-dir and kubelet-dir hostPaths and the
# kubelet-dir mountPath all follow it. The mountPath of kubelet-dir must stay
# equal to the host path, because the kubelet hands the plugin host paths as
# target paths.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: glusterfs-csi-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glusterfs-csi.labels" (dict "ctx" . "component" "node") | nindent 4 }}
spec:
  # Restarting the plugin container tears down every GlusterFS mount of the
  # node (the FUSE processes live in that container), so a rolling update would
  # break the I/O of all pods at once. An administrator deletes the pods node by
  # node instead, after draining the workloads of that node.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: glusterfs-csi
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glusterfs-csi
        app.kubernetes.io/part-of: glusterfs-csi
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: glusterfs-csi-node
      # The node plugin never talks to the Kubernetes API: its configuration
      # comes from the mounted ConfigMap file.
      automountServiceAccountToken: false
      # The FUSE client has to resolve the Gluster server host names (D-21).
      # With hostNetwork the pod gets the /etc/hosts the kubelet copies from the
      # node, so any name the node can resolve also works inside the container.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: {{ .Values.node.priorityClassName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: glusterfs-csi
          image: {{ include "glusterfs-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Every flag is spelled out even where it matches the default, so the
          # values can be compared against the volumeMount paths below.
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
            - --nodeid=$(NODE_ID)
            - --config=/etc/glusterfs-csi/config.json
            - --state-dir={{ include "glusterfs-csi.pluginDir" . }}/staged
            - --recovery-interval={{ .Values.node.recoveryInterval }}
            - --mount-log-dir=/var/log/glusterfs/csi
            - --v={{ .Values.logLevel }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # /dev/fuse and the Bidirectional mount propagation of the kubelet
          # directory both require a privileged container.
          securityContext:
            privileged: true
          ports:
            - name: healthz
              containerPort: 29651
              protocol: TCP
          # A failed probe restarts the container, which disconnects every mount
          # of this node; the thresholds are therefore generous.
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          # No limits on purpose: the FUSE processes run in this container and
          # an OOM kill would disconnect every GlusterFS mount of the node.
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: {{ .Values.kubeletDir }}
              mountPropagation: Bidirectional
            - name: config
              mountPath: /etc/glusterfs-csi
              readOnly: true
            - name: mount-log
              mountPath: /var/log/glusterfs/csi
        - name: node-driver-registrar
          image: "{{ .Values.sidecars.nodeDriverRegistrar.image.repository }}:{{ .Values.sidecars.nodeDriverRegistrar.image.tag }}"
          args:
            - --v={{ .Values.logLevel }}
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ include "glusterfs-csi.pluginDir" . }}/csi.sock
          livenessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path={{ include "glusterfs-csi.pluginDir" . }}/csi.sock
                - --mode=kubelet-registration-probe
            initialDelaySeconds: 30
            periodSeconds: 90
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.sidecars.nodeDriverRegistrar.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: "{{ .Values.sidecars.livenessProbe.image.repository }}:{{ .Values.sidecars.livenessProbe.image.tag }}"
          args:
            - --v={{ .Values.logLevel }}
            - --csi-address=/csi/csi.sock
            - --http-endpoint=:29651
            - --probe-timeout=5s
          resources:
            {{- toYaml .Values.sidecars.livenessProbe.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ include "glusterfs-csi.pluginDir" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ include "glusterfs-csi.registrationDir" . }}
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.kubeletDir }}
            type: Directory
        # Mounted as a directory, without "optional" and without "items" (no
        # subPath either): only then does the kubelet update the file in place
        # when the ConfigMap changes, which the driver hot-reloads.
        - name: config
          configMap:
            name: glusterfs-csi-config
        - name: mount-log
          hostPath:
            path: /var/log/glusterfs/csi
            type: DirectoryOrCreate
