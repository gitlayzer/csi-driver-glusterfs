# Namespace scoped permissions of the csi-provisioner sidecar: the leader election Lease.
#
# The upstream Role also grants csistoragecapacities, pods and replicasets, but
# those are only needed with --enable-capacity. This driver does not implement
# GET_CAPACITY before M3, so the rights are not granted now.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glusterfs-csi-provisioner-cfg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glusterfs-csi.labels" (dict "ctx" .) | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - watch
      - list
      - delete
      - update
      - create
