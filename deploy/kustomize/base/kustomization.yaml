# Base: namespace, CSIDriver, the node DaemonSet, the controller Deployment and their RBAC.
#
# The base intentionally does NOT contain the glusterfs-csi-config ConfigMap: it
# has to be provided by an overlay (see overlays/sample). Without it the "config"
# volume of both the node DaemonSet and the controller Deployment cannot be
# resolved and the pods stay in ContainerCreating.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glusterfs-csi

resources:
  - namespace.yaml
  - csidriver.yaml
  - serviceaccount.yaml
  - node-daemonset.yaml
  - controller-serviceaccount.yaml
  - controller-clusterrole.yaml
  - controller-clusterrolebinding.yaml
  - controller-role.yaml
  - controller-rolebinding.yaml
  - controller-deployment.yaml

images:
  - name: ghcr.io/gitlayzer/glusterfs-csi
    newTag: main
